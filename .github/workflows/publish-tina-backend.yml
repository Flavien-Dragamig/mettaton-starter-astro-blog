name: Publier l'image backend Tina (GHCR)

# Image de référence du backend TinaCMS self-host (recette Mettaton Lot 4a).
# Bakée avec le schéma de CE starter (collections tina/config.ts) : sert de
# démonstration/point de départ, pas un runtime générique multi-schémas — un
# site avec ses propres collections doit builder sa propre image depuis son
# repo équipé (même Dockerfile.backend, PR d'équipement Mettaton).
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.backend"
      - "tina/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ghcr.io/flavien-dragamig/mettaton-tina-backend:latest
            ghcr.io/flavien-dragamig/mettaton-tina-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
